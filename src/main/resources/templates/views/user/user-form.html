<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('UserRole')"></head>
<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>
<main class="form-page">
    <div class="form-card">
        <h1 th:text="${user.id == null} ? #{msg.user-form.add} : #{msg.user-form.edit}"></h1>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <form th:action="${user.id == null} ? @{/users/insert} : @{/users/update}"
              th:object="${user}" method="post" class="mt-3">
            <input type="hidden" th:field="*{id}" />
            <div class="mb-3">
                <label for="username" class="form-label"
                       th:text="#{msg.user-form.username}"></label>
                <input type="text" id="username" th:field="*{username}" class="form-control" />
                <div th:if="${#fields.hasErrors('username')}" class="text-danger"
                     th:errors="*{username}"></div>
            </div>
            <div class="mb-3">
                <label for="passwordHash" class="form-label"
                       th:text="#{msg.user-form.password}"></label>
                <input type="text" id="passwordHash" th:field="*{passwordHash}" class="form-control" />
                <div th:if="${#fields.hasErrors('passwordHash')}" class="text-danger"
                     th:errors="*{passwordHash}"></div>
            </div>
            <div class="mb-3">
                <label for="lastPasswordChange" class="form-label"
                       th:text="#{msg.user-form.lastPasswordChange}"></label>
                <input type="datetime-local" id="lastPasswordChange"
                       th:field="*{lastPasswordChange}" class="form-control" />
                <div th:if="${#fields.hasErrors('lastPasswordChange')}" class="text-danger"
                     th:errors="*{lastPasswordChange}"></div>
            </div>
            <div class="mb-3">
                <label for="failedLoginAttempts" class="form-label"
                       th:text="#{msg.user-form.failedLoginAttempts}"></label>
                <input type="number" id="failedLoginAttempts" min="0"
                       th:field="*{failedLoginAttempts}" class="form-control" />
                <div th:if="${#fields.hasErrors('failedLoginAttempts')}" class="text-danger"
                     th:errors="*{failedLoginAttempts}"></div>
            </div>
            <!-- Checkboxes de tipo sí/no (los 4 iguales) -->
            <div class="form-check mb-2">
                <input type="checkbox" id="active" th:field="*{active}" class="form-check-input" />
                <label for="active" class="form-check-label"
                       th:text="#{msg.user-form.active}"></label>
            </div>
            <div class="form-check mb-2">
                <input type="checkbox" id="accountNonLocked" th:field="*{accountNonLocked}"
                       class="form-check-input" />
                <label for="accountNonLocked" class="form-check-label"
                       th:text="#{msg.user-form.accountNonLocked}"></label>
            </div>
            <div class="form-check mb-2">
                <input type="checkbox" id="emailVerified" th:field="*{emailVerified}"
                       class="form-check-input" />
                <label for="emailVerified" class="form-check-label"
                       th:text="#{msg.user-form.emailVerified}"></label>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" id="mustChangePassword" th:field="*{mustChangePassword}"
                       class="form-check-input" />
                <label for="mustChangePassword" class="form-check-label"
                       th:text="#{msg.user-form.mustChangePassword}"></label>
            </div>
            <!-- ROLES: un checkbox por cada rol que existe. Se pueden marcar varios -->
            <div class="mb-3">
                <label class="form-label fw-bold" th:text="#{msg.user-form.roles}"></label>
                <div class="form-check" th:each="role : ${listRoles}">
                    <input type="checkbox" class="form-check-input"
                           th:field="*{roleIds}" th:value="${role.id}" />
                    <label class="form-check-label" th:for="${#ids.prev('roleIds')}"
                           th:text="${role.name}"></label>
                </div>
                <div th:if="${#fields.hasErrors('roleIds')}" class="text-danger"
                     th:errors="*{roleIds}"></div>
            </div>
            <button type="submit" class="btn btn-primary"
                    th:text="${user.id == null} ? #{msg.user-form.create} : #{msg.user-form.update}">
            </button>
            <a th:href="@{/users}" class="btn btn-secondary"
               th:text="#{msg.user-form.returnback}"></a>
        </form>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>
</body>
</html>
