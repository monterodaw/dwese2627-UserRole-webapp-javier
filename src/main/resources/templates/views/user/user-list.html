<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('UserRole')"></head>
<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>
<main class="list-page">
    <div class="list-card">
        <h1 th:text="#{msg.user-list.title}"></h1>
        <a th:href="@{/users/new}" class="btn btn-success" th:text="#{msg.user-list.add}"></a>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <table class="table table-bordered table-striped mt-3">
            <thead>
            <tr>
                <th th:text="#{msg.user-list.id}"></th>
                <th th:text="#{msg.user-list.username}"></th>
                <th th:text="#{msg.user-list.active}"></th>
                <th th:text="#{msg.user-list.roles}"></th>
                <th th:text="#{msg.user-list.passwordExpiresAt}"></th>
                <th th:text="#{msg.user-list.actions}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${listUsers}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.active}"></td>
                <td>
                    <!-- un "badge" por cada rol del usuario -->
                    <span th:each="role : ${user.roles}" class="badge bg-secondary me-1"
                          th:text="${role.name}"></span>
                </td>
                <td th:text="${#temporals.format(user.passwordExpiresAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <a th:href="@{/users/edit(id=${user.id})}" class="btn btn-primary btn-sm"
                       th:text="#{msg.user-list.edit}"></a>
                    <form th:action="@{/users/delete}" method="post" class="d-inline">
                        <input type="hidden" name="id" th:value="${user.id}" />
                        <button type="submit" class="btn btn-danger btn-sm"
                                th:text="#{msg.user-list.delete}"
                                th:data-confirm="#{msg.user-list.confirm}"
                                onclick="return confirm(this.dataset.confirm);"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>
</body>
</html>
