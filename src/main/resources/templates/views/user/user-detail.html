
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('UserRole')"></head>
<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header><main class="form-page">
    <div class="form-card">
        <h1 th:text="#{msg.user-detail.title}"></h1>
        <dl class="row mt-3">
            <dt class="col-sm-4" th:text="#{msg.user-list.id}"></dt>
            <dd class="col-sm-8" th:text="${user.id}"></dd>
            <dt class="col-sm-4" th:text="#{msg.user-list.username}"></dt>
            <dd class="col-sm-8" th:text="${user.username}"></dd>
            <dt class="col-sm-4" th:text="#{msg.user-list.active}"></dt>
            <dd class="col-sm-8" th:text="${user.active}"></dd>
            <dt class="col-sm-4" th:text="#{msg.user-list.accountNonLocked}"></dt>
            <dd class="col-sm-8" th:text="${user.accountNonLocked}"></dd>
            <dt class="col-sm-4" th:text="#{msg.user-list.lastPasswordChange}"></dt>
            <dd class="col-sm-8"
                th:text="${#temporals.format(user.lastPasswordChange, 'dd/MM/yyyy HH:mm')}"></dd>
            <dt class="col-sm-4" th:text="#{msg.user-list.passwordExpiresAt}"></dt>
            <dd class="col-sm-8"
                th:text="${#temporals.format(user.passwordExpiresAt, 'dd/MM/yyyy HH:mm')}"></dd>
            <dt class="col-sm-4" th:text="#{msg.user-list.failedLoginAttempts}"></dt>
            <dd class="col-sm-8" th:text="${user.failedLoginAttempts}"></dd>
            <dt class="col-sm-4" th:text="#{msg.user-list.emailVerified}"></dt>
            <dd class="col-sm-8" th:text="${user.emailVerified}"></dd>
            <dt class="col-sm-4" th:text="#{msg.user-list.mustChangePassword}"></dt>
            <dd class="col-sm-8" th:text="${user.mustChangePassword}"></dd>
            <dt class="col-sm-4" th:text="#{msg.user-detail.roles}"></dt>
            <dd class="col-sm-8">
<span th:each="role : ${user.roles}" class="badge bg-secondary me-1"
      th:text="${role.name}"></span>
            </dd>
        </dl>
        <a th:href="@{/users}" class="btn btn-secondary"
           th:text="#{msg.user-detail.returnback}"></a>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>
</body>
</html>
